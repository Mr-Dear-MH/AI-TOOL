<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#262626" stroke-width="4" />

  <!-- Outer Golden Glowing Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4" />

  <!-- Cinematic Film Reel / Lens Aperture Spokes -->
  <g stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" stroke-linecap="round">
    <line x1="256" y1="88" x2="256" y2="124" />
    <line x1="256" y1="388" x2="256" y2="424" />
    <line x1="88" y1="256" x2="124" y2="256" />
    <line x1="388" y1="256" x2="424" y2="256" />
    <line x1="137" y1="137" x2="163" y2="163" />
    <line x1="349" y1="349" x2="375" y2="375" />
    <line x1="137" y1="375" x2="163" y2="349" />
    <line x1="349" y1="163" x2="375" y2="137" />
  </g>

  <!-- Central Camera / Play Triangle Shape with Shadow -->
  <g filter="url(#shadow)">
    <!-- Polygon Play Arrow -->
    <path d="M 216 160 L 344 256 L 216 352 Z" fill="url(#goldGrad)" />
    <!-- AI Sparkle in top right corner -->
    <path d="M 340 140 Q 360 140 360 120 Q 360 140 380 140 Q 360 140 360 160 Q 360 140 340 140 Z" fill="url(#glowGrad)" />
  </g>

  <!-- Bottom subtitle badge -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="4" fill="#fbbf24">VEO 3 AI</text>
</svg>
